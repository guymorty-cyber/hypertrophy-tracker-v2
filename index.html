<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hypertrophy">
<meta name="mobile-web-app-capable" content="yes">
<title>Hypertrophy Tracker</title>
<meta name="theme-color" content="#14171b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">
      <button id="backbtn" class="hidden" aria-label="Back">‹</button>
      <div class="mark">HT</div>
      <div>
        <h1>Hypertrophy Tracker</h1>
        <div class="phase" id="phaseLabel">—</div>
      </div>
    </div>
    <button class="iconbtn" id="exportQuickBtn" title="More" aria-label="More options">⋯</button>
  </div>
  <div id="savePanel"><span id="saveStatus" role="status" aria-live="polite">Saved on this device</span><button id="retrySave" hidden>Retry save</button><button id="exportRecovery" hidden>Export recovery data</button><button id="updateApp" hidden>Update app</button></div>
  <div id="offlineStatus" role="status" aria-live="polite"></div>
  <div id="undoPanel" hidden>Workout deleted. <button id="undoDelete">Undo</button></div>
  <div id="content"></div>
</div>

<div id="resttimer">
  <div>Rest <span class="rt-time mono" id="rtTime">01:00</span></div>
  <div style="display:flex;gap:8px;">
    <button id="rtAdd30">+30s</button>
    <button id="rtSkip">Skip</button>
  </div>
</div>

<div id="navbar">
  <button data-tab="home"><span class="navicon">⌂</span>Home</button>
  <button data-tab="train"><span class="navicon">⛁</span>Train</button>
  <button data-tab="progress"><span class="navicon">↗</span>Progress</button>
  <button data-tab="history"><span class="navicon">▤</span>History</button>
  <button data-tab="more"><span class="navicon">⚙</span>More</button>
</div>

<div class="overlay hide" id="overlay"><div class="modal" id="modalBody" role="dialog" aria-modal="true" aria-label="Tracker dialog" tabindex="-1"></div></div>
<div id="entryToolbar" role="group" aria-label="Input navigation" hidden>
  <span id="entryLabel"></span><button id="entryPrevious" aria-label="Previous input">Previous</button><button id="entryNext" aria-label="Next input">Next</button><button id="entryDone">Done</button>
</div>

<script defer src="./js/data.js"></script>
<script defer src="./js/storage.js"></script>
<script defer src="./js/helpers.js"></script>
<script defer src="./js/coaching.js"></script>
<script defer src="./js/ui.js"></script>
<script defer src="./js/views/home.js"></script>
<script defer src="./js/views/workout.js"></script>
<script defer src="./js/views/progress.js"></script>
<script defer src="./js/views/history.js"></script>
<script defer src="./js/views/more.js"></script>
<script defer src="./js/events.js"></script>
<script defer src="./js/programme.js"></script>
<script defer src="./js/workouts.js"></script>
<script defer src="./js/timer.js"></script>
<script defer src="./js/tracking.js"></script>
<script defer src="./js/body.js"></script>
<script defer src="./js/backup.js"></script>
<script defer src="./js/history.js"></script>
<script defer src="./js/pwa.js"></script>
<script defer src="./js/mobile.js"></script>
<script defer src="./js/app.js"></script>
</body>
</html>
