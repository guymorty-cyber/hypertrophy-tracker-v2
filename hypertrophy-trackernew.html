<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hypertrophy">
<meta name="mobile-web-app-capable" content="yes">
<title>Hypertrophy Tracker</title>

<style>
:root{
  --bg:#14171b;
  --surface:#1c2126;
  --surface-2:#242a30;
  --surface-3:#2c333a;
  --line:#333b42;
  --text:#edeff1;
  --text-dim:#93a0aa;
  --text-faint:#5f6a72;
  --accent:#ff7a3d;
  --accent-dim:#7a3f22;
  --teal:#35c9b0;
  --warn:#f2b33d;
  --danger:#e5484d;
  --good:#4cc38a;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}

/* header */
#topbar{position:sticky;top:0;z-index:20;background:rgba(20,23,27,.92);backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;}
#topbar .brand{display:flex;align-items:center;gap:10px;}
#topbar .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1a1a;font-size:15px;}
#topbar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.2px;}
#topbar .phase{font-size:11px;color:var(--text-dim);margin-top:1px;}
#backbtn{background:none;border:none;color:var(--text-dim);font-size:22px;padding:2px 10px 2px 0;line-height:1;}

/* content */
#content{padding:16px 16px 24px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card-tight{padding:12px 14px;}
h2.section{font-size:13px;text-transform:none;color:var(--text-dim);margin:22px 0 10px;font-weight:700;}
h2.section:first-child{margin-top:0;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:10px;}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;}
.pill-accent{background:rgba(255,122,61,.15);color:var(--accent);}
.pill-good{background:rgba(76,195,138,.15);color:var(--good);}
.pill-warn{background:rgba(242,179,61,.18);color:var(--warn);}
.pill-danger{background:rgba(229,72,77,.18);color:var(--danger);}
.pill-teal{background:rgba(53,201,176,.15);color:var(--teal);}
.pill-dim{background:var(--surface-3);color:var(--text-dim);}

/* buttons */
.btn{display:block;width:100%;text-align:center;border:none;border-radius:12px;padding:16px;
  font-size:16px;font-weight:800;cursor:pointer;letter-spacing:-.2px;}
.btn-primary{background:var(--accent);color:#1a1207;}
.btn-primary:active{opacity:.85;}
.btn-secondary{background:var(--surface-3);color:var(--text);}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent-dim);}
.btn-danger-outline{background:transparent;color:var(--danger);border:1px solid rgba(229,72,77,.4);}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:9px;width:auto;display:inline-block;}
.btn-ghost{background:none;border:none;color:var(--text-dim);font-size:13px;font-weight:600;padding:6px 0;}
.iconbtn{background:var(--surface-3);border:none;color:var(--text);width:34px;height:34px;border-radius:9px;
  font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* dashboard */
.next-card{background:linear-gradient(155deg,#20262c,#1a1e23);border:1px solid var(--line);}
.next-card .eyebrow{color:var(--accent);font-size:12px;font-weight:800;margin-bottom:2px;}
.next-card h3{font-size:26px;margin:2px 0 6px;font-weight:800;letter-spacing:-.5px;}
.next-card .meta{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;}
.stat-box .label{font-size:11.5px;color:var(--text-dim);margin-bottom:5px;}
.stat-box .value{font-size:19px;font-weight:800;}
.stat-box .sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.trend-up{color:var(--good);}
.trend-down{color:var(--danger);}
.trend-flat{color:var(--text-dim);}

/* exercise cards in workout */
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.ex-head{padding:14px 16px 10px;}
.ex-title{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0 0 3px;}
.ex-target{font-size:12.5px;color:var(--text-dim);}
.ex-note{font-size:12px;color:var(--teal);margin-top:6px;line-height:1.4;}
.ex-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.ex-actions button{font-size:11.5px;padding:6px 10px;border-radius:8px;background:var(--surface-3);border:none;color:var(--text-dim);}
.prev-line{font-size:12px;color:var(--text-faint);margin-top:4px;}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:8px;align-items:center;
  padding:8px 16px;border-top:1px solid var(--line);}
.setrow .setnum{color:var(--text-dim);font-size:13px;font-weight:700;}
.setrow input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  color:var(--text);padding:9px 6px;font-size:15px;text-align:center;}
.setrow input::placeholder{color:var(--text-faint);}
.setrow .prevmini{font-size:10px;color:var(--text-faint);display:block;text-align:center;margin-top:2px;}
.checkwrap{display:flex;align-items:center;justify-content:center;}
.checkwrap input[type=checkbox]{width:26px;height:26px;accent-color:var(--good);}
.reco{margin:0 16px 14px;padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:600;line-height:1.4;}
.reco-up{background:rgba(255,122,61,.12);color:var(--accent);}
.reco-reps{background:rgba(53,201,176,.12);color:var(--teal);}
.reco-maintain{background:rgba(242,179,61,.13);color:var(--warn);}
.notesbox{margin:0 16px 14px;}
.notesbox textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);padding:9px 10px;font-size:13px;min-height:36px;resize:vertical;font-family:inherit;}

/* rest timer bar */
#resttimer{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));z-index:15;
  max-width:480px;margin:0 auto;background:var(--teal);color:#08211d;padding:10px 16px;
  display:none;align-items:center;justify-content:space-between;font-weight:800;}
#resttimer.show{display:flex;}
#resttimer .rt-time{font-size:20px;}
#resttimer button{background:rgba(0,0,0,.15);border:none;color:#08211d;padding:8px 12px;border-radius:8px;font-weight:800;font-size:12px;}

/* bottom nav */
#navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:480px;margin:0 auto;
  background:rgba(20,23,27,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);}
#navbar button{flex:1;background:none;border:none;color:var(--text-faint);padding:10px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;}
#navbar button.active{color:var(--accent);}
#navbar .navicon{font-size:19px;line-height:1;}

/* history */
.hist-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.hist-item .row{margin-bottom:6px;}
.hist-item .dname{font-weight:800;font-size:15px;}
.hist-item .ddate{font-size:12px;color:var(--text-dim);}
.hist-meta{display:flex;gap:14px;font-size:12px;color:var(--text-dim);margin-top:4px;}

/* progress */
.svgwrap{width:100%;background:var(--surface-2);border-radius:10px;padding:8px 4px;}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.metric{background:var(--surface-2);border-radius:10px;padding:11px;}
.metric .label{font-size:11px;color:var(--text-dim);}
.metric .value{font-size:16px;font-weight:800;margin-top:3px;}
.searchbox{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);padding:11px 13px;font-size:14px;margin-bottom:10px;}
select.searchbox{-webkit-appearance:none;appearance:none;}
.hist-row-mini{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-top:1px solid var(--line);}
.hist-row-mini .sets{color:var(--text-dim);font-family:ui-monospace,monospace;}

/* PR table */
.pr-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);}
.pr-item:first-child{border-top:none;}
.pr-item .exname{font-size:14px;font-weight:700;}
.pr-item .prval{font-size:14px;font-weight:800;color:var(--accent);}
.pr-item .prsub{font-size:11px;color:var(--text-faint);}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,11,13,.72);z-index:50;display:flex;align-items:flex-end;
  justify-content:center;}
.overlay.hide{display:none;}
.modal{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:88vh;
  overflow-y:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));}
.modal h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.modal .sub{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;color:var(--text);padding:11px 13px;font-size:15px;font-family:inherit;}
.field textarea{min-height:60px;resize:vertical;}
.painscale{display:flex;gap:6px;}
.painscale button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--text);font-weight:800;font-size:13px;}
.painscale button.sel{background:var(--accent);color:#1a1207;border-color:var(--accent);}
.knee-flag{padding:10px 12px;border-radius:10px;font-size:12.5px;margin:10px 0;font-weight:600;line-height:1.4;}

/* summary modal */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.summary-box{background:var(--surface-2);border-radius:10px;padding:12px;text-align:center;}
.summary-box .big{font-size:20px;font-weight:800;}
.summary-box .lbl{font-size:11px;color:var(--text-dim);margin-top:2px;}
.newpr-badge{background:rgba(255,122,61,.15);color:var(--accent);border-radius:10px;padding:9px 12px;font-size:13px;
  font-weight:700;margin-bottom:8px;}

/* editor / more tab */
.day-editor-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);}
.day-editor-row:first-child{border-top:none;}
.day-editor-row .exname{flex:1;font-size:13.5px;}
.day-editor-row .arrows{display:flex;gap:4px;}
.day-editor-row .arrows button{background:var(--surface-3);border:none;color:var(--text);width:28px;height:28px;border-radius:7px;font-size:12px;}
.altlist button{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px;margin-bottom:8px;font-size:14px;color:var(--text);}
.altlist button.current{border-color:var(--accent);color:var(--accent);}

.empty{text-align:center;color:var(--text-faint);font-size:13px;padding:30px 10px;}
a.linklike{color:var(--accent);text-decoration:none;font-weight:700;font-size:13px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">
      <button id="backbtn" class="hidden">‹</button>
      <div class="mark">HT</div>

        <h1>Hypertrophy Tracker</h1>
        <div class="phase" id="phaseLabel">—</div>
      </div>
    </div>
    <button class="iconbtn" id="exportQuickBtn" title="More">⋯</button>
  </div>
  <div id="content"></div>
</div>

<div id="resttimer">
  <div>Rest <span class="rt-time mono" id="rtTime">01:00</span></div>
  <div style="display:flex;gap:8px;">
    <button id="rtAdd30">+30s</button>
    <button id="rtSkip">Skip</button>
  </div>
</div>

<div id="navbar">
  <button data-tab="home"><span class="navicon">⌂</span>Home</button>
  <button data-tab="train"><span class="navicon">⛁</span>Train</button>
  <button data-tab="progress"><span class="navicon">↗</span>Progress</button>
  <button data-tab="history"><span class="navicon">▤</span>History</button>
  <button data-tab="more"><span class="navicon">⚙</span>More</button>
</div>

<div class="overlay hide" id="overlay"><div class="modal" id="modalBody"></div></div>

 {weeks:[6,7],name:'Intensification',detail:'Compounds: leave 1–2 reps in reserve · Isolation: push close to failure'},
 {weeks:[8,8],name:'Peak',detail:'Compounds: leave ~1 rep in reserve · Final isolation sets can reach failure'}
];

function todayISO(){ return new Date().toISOString().slice(0,10); }

function load(){

/* ============================= HELPERS ============================= */
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function fmtDateFull(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});
}
function findExercise(exId){
  for(const day of DATA.program){
    for(const ex of day.exercises){ if(ex.id===exId) return ex; }
  }
  return null;
}
function findDayByIdx(idx){ return DATA.program[idx]; }
function getWeekNumber(){
  const start = new Date(DATA.programStartDate+'T00:00:00');
  const now = new Date(todayISO()+'T00:00:00');
  const diffDays = Math.floor((now-start)/86400000);
  const wk = Math.floor(diffDays/7)+1;
  return Math.max(1, wk>8 ? ((wk-1)%8)+1 : wk); // cycle after week 8
}
function getPhase(weekNum){
  for(const p of PHASES){ if(weekNum>=p.weeks[0] && weekNum<=p.weeks[1]) return p; }
  return PHASES[0];
}
function getTodayProgramDay(){
  // Monday=0 ... Sunday=6 mapping to program index
  const jsDay = new Date().getDay(); // 0=Sun..6=Sat
  const idx = jsDay===0 ? 6 : jsDay-1; // Mon->0 ... Sun->6
  return idx;
}
function estOneRM(weight,reps){
  if(!weight||!reps) return 0;
  return weight*(1+reps/30);
}
function allCompletedSetsFor(exId){
  const out = [];
  for(const s of DATA.sessions){
    const exLog = s.exercises.find(e=>e.exerciseId===exId);
    if(!exLog) continue;
    exLog.sets.forEach((st,i)=>{
      if(st.completed && st.weight>0 && st.reps>0){
        out.push({date:s.date,sessionId:s.id,weight:st.weight,reps:st.reps,setIndex:i});
      }
    });
  }
  return out.sort((a,b)=> a.date<b.date?-1:1);
}
function getPRFor(exId){
  const sets = allCompletedSetsFor(exId);
  if(!sets.length) return null;
  let heaviest = sets[0], bestE1RM = sets[0];
  const byWeight = {};
  sets.forEach(s=>{
    if(s.weight>heaviest.weight) heaviest=s;
    const e = estOneRM(s.weight,s.reps);
    if(e> estOneRM(bestE1RM.weight,bestE1RM.reps)) bestE1RM=s;
    if(!byWeight[s.weight] || s.reps>byWeight[s.weight].reps) byWeight[s.weight]=s;
  });
  return {heaviest, bestE1RM, byWeight, all:sets};
}
function lastSessionFor(exId){
  const dates = allCompletedSetsFor(exId);
  if(!dates.length) return null;
  const lastDate = dates[dates.length-1].sessionId;
  const s = DATA.sessions.find(x=>x.id===lastDate);
  if(!s) return null;
  const exLog = s.exercises.find(e=>e.exerciseId===exId);
  return {session:s, log:exLog};
}
function exerciseIndexPath(exId){
  for(let di=0; di<DATA.program.length; di++){
    const ei = DATA.program[di].exercises.findIndex(e=>e.id===exId);
    if(ei>-1) return {di,ei};
  }
  return null;
}

/* recommendation engine — pure double progression on reps */
function computeRecommendation(exDef, lastLog){
  if(!lastLog || !lastLog.sets || !lastLog.sets.length) return null;
  const completed = lastLog.sets.filter(s=>s.completed && s.weight>0 && s.reps>0);
  if(!completed.length) return null;
  const allAtTop = completed.length>=exDef.sets && completed.every(s=>s.reps>=exDef.repMax);
  const topWeight = Math.max(...completed.map(s=>s.weight));

  if(allAtTop){
    const next = Math.round((topWeight+exDef.inc)*4)/4;
    return {type:'up', text:`Increase to ${next}kg next time — you hit ${exDef.repMax} reps across all sets.`, nextWeight:next};
  }
  const belowMin = completed.some(s=>s.reps<exDef.repMin);
  if(belowMin){
    return {type:'maintain', text:`Keep ${topWeight}kg — focus on getting every set into the ${exDef.repMin}–${exDef.repMax} rep range.`, nextWeight:topWeight};
  }
  return {type:'reps', text:`Keep ${topWeight}kg — aim for more reps (up to ${exDef.repMax}) across all sets next time.`, nextWeight:topWeight};
}

/* knee pain evaluation */
function evalKnee(score){
  if(score===null||score===undefined) return null;
  if(score<=1) return {level:'green',label:'Continue normally',cls:'pill-good'};
  if(score===2) return {level:'yellow',label:'Maintain load — do not progress',cls:'pill-warn'};
  if(score===3) return {level:'orange',label:'Stop this movement — substitute a hip-dominant/stable alternative',cls:'pill-warn'};
  return {level:'red',label:'Stop lower-body loading — seek clinical assessment',cls:'pill-danger'};
}

function computeWeeklyAvg(){
  const bw = DATA.bodyweight.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!bw.length) return [];
  const start = new Date(bw[0].date+'T00:00:00');
  const buckets = {};
  bw.forEach(e=>{
    const d = new Date(e.date+'T00:00:00');
    const wk = Math.floor((d-start)/(7*86400000));
    if(!buckets[wk]) buckets[wk]=[];
    buckets[wk].push(e.weight);
  });
  return Object.keys(buckets).sort((a,b)=>a-b).map(k=>{
    const arr = buckets[k];
    return {week:parseInt(k), avg: arr.reduce((a,b)=>a+b,0)/arr.length};
  });
}
function allExercisePRs(){
  const out = [];
  DATA.program.forEach(day=>{
    day.exercises.forEach(ex=>{
      const pr = getPRFor(ex.id);
      if(pr) out.push({exId:ex.id, name:ex.name, pr});
    });
  });
  return out;
}

          <div class="metric"><div class="label">Next target</div><div class="value" style="font-size:13px;">${rec?rec.text.split('—')[0].trim():'Log a session first'}</div></div>
        </div>
      </div>

      <div class="card card-tight">
        ${sessionsArr.length ? sessionsArr.map(s=>{
          const line = Object.keys(s.weights).sort((a,b)=>b-a).map(w=>`${w}kg — ${s.weights[w].join(', ')}`).join(' / ');
          return `<div class="hist-row-mini"><span>${fmtDate(s.date)}</span><span class="sets">${line}</span></div>`;
        }).join('') : `<div class="empty">No sets logged yet for this exercise.</div>`}
      </div>
    `;
  }

  return `
    <h2 class="section" style="margin-top:0;">Progression</h2>
    <input class="searchbox" id="exSearch" placeholder="Search exercise…" value="${escapeHtml(exerciseFilterQuery)}">
    <select class="searchbox" id="exSelect">
      ${filtered.map(e=>`<option value="${e.id}" ${e.id===selectedProgressExId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
    </select>
    ${detailHtml}
    <h2 class="section">Personal Records</h2>
    ${renderPRList()}
  `;
}
function renderSparkline(series){
  if(!series.length) return `<div class="empty">No data yet</div>`;
  const w=440,h=110,pad=16;
  const values = series.map(s=>s.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min)||1;
  const stepX = series.length>1 ? (w-2*pad)/(series.length-1) : 0;
  const pts = series.map((s,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((s.value-min)/range)*(h-2*pad);
    return [x,y];
  });
  const pathD = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#ff7a3d"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${pathD}" fill="none" stroke="#ff7a3d" stroke-width="2.5"/>
    ${dots}
  </svg>`;
}
function renderPRList(){
  const prs = allExercisePRs();
  if(!prs.length) return `<div class="card"><div class="empty">Log workouts to start tracking PRs.</div></div>`;
  prs.sort((a,b)=> b.pr.bestE1RM.weight - a.pr.bestE1RM.weight);
  return `<div class="card card-tight">
    ${prs.map(p=>`<div class="pr-item">
      <div>
        <div class="exname">${escapeHtml(p.name)}</div>
        <div class="prsub">Best reps @ heaviest: ${p.pr.heaviest.reps} reps · e1RM ${Math.round(estOneRM(p.pr.bestE1RM.weight,p.pr.bestE1RM.reps))}kg</div>
      </div>
      <div style="text-align:right;">
        <div class="prval">${p.pr.heaviest.weight}kg</div>
        <div class="prsub">${fmtDate(p.pr.bestE1RM.date)}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

function computeNutritionAdvice(){
  const weekAvg = computeWeeklyAvg();
  if(weekAvg.length<3) return null;
  const last3 = weekAvg.slice(-3);
  const diffs = [];
  for(let i=1;i<last3.length;i++) diffs.push(last3[i].avg-last3[i-1].avg);
  const lastTwo = diffs.slice(-2);
  if(lastTwo.length<2) return null;
  if(lastTwo.every(d=>d<0.05)) return `Weight gain has been under ${WEIGHT_GAIN_TARGET.min}kg/week for 2 weeks straight. Consider adding 100–150 kcal/day.`;
  if(lastTwo.every(d=>d>0.30)) return `Weight gain has exceeded 0.30kg/week for 2 weeks straight. Consider reducing 100–150 kcal/day.`;
  return null;
}

function attachTabEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.dataset.action;
    if(el._bound) return; // avoid dup (elements are recreated each render so fine, but guard anyway)
    if(action==='startToday'){
      el.onclick = ()=>{ startSession(getTodayProgramDay()); };
    }else if(action==='gotoTrain'){
      el.onclick = ()=> setTab('train');
    }else if(action==='startPicked'){
      el.onclick = ()=>{ const idx = parseInt(document.getElementById('dayPicker').value); startSession(idx); };
    }else if(action==='cancelSession'){
      el.onclick = ()=>{ if(confirm('Discard this workout?')){ DATA.activeSession=null; save(); stopRestTimer(); renderTab(); } };
    }else if(action==='setField'){
      el.oninput = ()=>{ updateSetField(el.dataset.exid, parseInt(el.dataset.setidx), el.dataset.field, el.value); };
    }else if(action==='toggleComplete'){
      el.onchange = ()=>{ toggleSetComplete(el.dataset.exid, parseInt(el.dataset.setidx), el.checked); };
    }else if(action==='exNotes'){
      el.oninput = ()=>{ setExerciseNotes(el.dataset.exid, el.value); };
    }else if(action==='startRest'){
      el.onclick = ()=> startRestTimer(parseInt(el.dataset.sec));
    }else if(action==='openAlts'){
      el.onclick = ()=> openAltsModal(el.dataset.exid);
    }else if(action==='editExFromWorkout'){
      el.onclick = ()=>{
        const path = exerciseIndexPath(el.dataset.exid);
        if(path) openExerciseEditModal(path.di, el.dataset.exid);
      };
    }else if(action==='setKnee'){
      el.onclick = ()=> setKneePain(el.dataset.phase, parseInt(el.dataset.val));
    }else if(action==='finishWorkout'){
      el.onclick = ()=> finishWorkoutFlow();
    }else if(action==='logNextMorning'){
      el.onclick = ()=> openNextMorningModal();
    }else if(action==='logNutritionToday' || action==='logNutrition'){
      el.onclick = ()=> logNutrition();
    }else if(action==='logBodyweight'){
      el.onclick = ()=> logBodyweight();
    }else if(action==='exportData'){
      el.onclick = ()=> exportData();
    }else if(action==='resetData'){
      el.onclick = ()=>{ if(confirm('This will erase ALL data permanently. Continue?')){ if(confirm('Are you absolutely sure?')){ localStorage.removeItem(STORAGE_KEY); DATA=defaultData(); save(); renderTab(); } } };
    }else if(action==='viewSession'){
      el.onclick = ()=> openSessionDetail(el.dataset.sid);
    }
  });

  const exSearch = document.getElementById('exSearch');
  if(exSearch) exSearch.oninput = ()=>{ exerciseFilterQuery = exSearch.value; renderTab(); setTimeout(()=>{ const s=document.getElementById('exSearch'); if(s){s.focus(); s.setSelectionRange(s.value.length,s.value.length);} },0); };
  const exSelect = document.getElementById('exSelect');
  if(exSelect) exSelect.onchange = ()=>{ selectedProgressExId = exSelect.value; renderTab(); };
  const histSearch = document.getElementById('histSearch');
  if(histSearch) histSearch.oninput = ()=>{ historyFilterQuery = histSearch.value; renderTab(); setTimeout(()=>{ const s=document.getElementById('histSearch'); if(s){s.focus(); s.setSelectionRange(s.value.length,s.value.length);} },0); };
  const editDaySelect = document.getElementById('editDaySelect');
  if(editDaySelect){ editDaySelect.onchange = ()=> renderDayEditor(parseInt(editDaySelect.value)); renderDayEditor(parseInt(editDaySelect.value)); }
  const importFile = document.getElementById('importFile');
  if(importFile) importFile.onchange = (e)=> importData(e);
}

/* ---------- session logic ---------- */
function startSession(dayIdx){
  const day = DATA.program[dayIdx];
  const sess = {
    id: 'sess_'+Date.now(),
    date: todayISO(),
    startedAt: Date.now(),
    dayId: day.id,
    dayName: day.name,
    weekNumber: getWeekNumber(),
    phase: getPhase(getWeekNumber()).name,
    exercises: day.exercises.map(ex=>({
      exerciseId: ex.id,
      name: ex.name,
      notes: '',
      sets: Array.from({length:ex.sets}, ()=>({weight:null,reps:null,completed:false}))
    })),
    kneePain: {before:null, after:null, nextMorning:null},
    notes: ''
  };
  DATA.activeSession = sess;
  save();
  setTab('train');
}
function getActiveExLog(exId){
  return DATA.activeSession.exercises.find(e=>e.exerciseId===exId);
}
function updateSetField(exId, setIdx, field, value){
  const log = getActiveExLog(exId);
  const num = value===''? null : parseFloat(value);
  log.sets[setIdx][field] = num;
  save();
}
function toggleSetComplete(exId, setIdx, checked){
  const log = getActiveExLog(exId);
  log.sets[setIdx].completed = checked;
  save();
  renderTab();
}
function setExerciseNotes(exId, val){
  const log = getActiveExLog(exId);
  log.notes = val;
  save();
}
function setKneePain(phase, val){
  DATA.activeSession.kneePain[phase] = val;
  save();
  renderTab();
}

function openAltsModal(exId){
  const ex = findExercise(exId);
  if(!ex || !ex.alts) return;
  const options = [ex.name, ...ex.alts];
  showModal(`
    <h2>Swap exercise</h2>
    <div class="sub">Choose a substitute. Your history stays intact under the original name.</div>
    <div class="altlist">
      ${options.map(o=>`<button data-alt="${escapeHtml(o)}" class="${o===ex.name?'current':''}">${escapeHtml(o)}</button>`).join('')}
    </div>
    <button class="btn btn-ghost" data-action="closeModal">Cancel</button>
  `);
  document.querySelectorAll('[data-alt]').forEach(b=>{
    b.onclick = ()=>{
      const chosen = b.dataset.alt;
      // update log display name for this session only + program going forward
      const log = getActiveExLog(exId);
      log.name = chosen;
      const progEx = findExercise(exId);
      progEx.currentDisplay = chosen;
      save();
      closeModal();
      renderTab();

function startRestTimer(sec){
  stopRestTimer();
  restTimerState.total = sec;
  restTimerState.remaining = sec;
  restTimerState.running = true;
  document.getElementById('resttimer').classList.add('show');
  updateRestDisplay();
  restTimerState.interval = setInterval(()=>{
    restTimerState.remaining--;
    if(restTimerState.remaining<=0){
      updateRestDisplay();
      stopRestTimer();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    updateRestDisplay();
  },1000);
}
function stopRestTimer(){
  if(restTimerState.interval) clearInterval(restTimerState.interval);
  restTimerState.interval = null;
  restTimerState.running = false;
  document.getElementById('resttimer').classList.remove('show');
}
function updateRestDisplay(){
  const m = Math.floor(Math.max(0,restTimerState.remaining)/60);
  const s = Math.max(0,restTimerState.remaining)%60;
  document.getElementById('rtTime').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
document.getElementById('rtAdd30').onclick = ()=>{ restTimerState.remaining+=30; updateRestDisplay(); };
document.getElementById('rtSkip').onclick = ()=> stopRestTimer();

function finishWorkoutFlow(){
  const sess = DATA.activeSession;
  const day = DATA.program.find(d=>d.id===sess.dayId);
  if(day.isLower && sess.kneePain.after===null){
    if(!confirm('Knee pain after workout not logged. Finish anyway?')) return;
  }
  sess.notes = document.getElementById('workoutNotes') ? document.getElementById('workoutNotes').value : sess.notes;
  sess.durationSec = Math.round((Date.now()-sess.startedAt)/1000);

  let totalSets=0, totalReps=0, totalVolume=0, newPRs=[];
  sess.exercises.forEach(exLog=>{
    const beforePR = getPRFor(exLog.exerciseId);
    exLog.sets.forEach(s=>{
      if(s.completed && s.weight>0 && s.reps>0){
        totalSets++; totalReps+=s.reps; totalVolume += s.weight*s.reps;
      }
    });
  });
  DATA.sessions.push(sess);
  // recompute PRs after adding session to detect new ones
  sess.exercises.forEach(exLog=>{
    const pr = getPRFor(exLog.exerciseId);
    if(pr && pr.bestE1RM.sessionId===sess.id){
      newPRs.push(exLog.name);
    }
  });
  sess.totalSets = totalSets; sess.totalReps = totalReps; sess.totalVolume = totalVolume; sess.newPRs = newPRs;

  if(day.isLower){
    DATA.pendingNextMorning = {sessionId: sess.id, dayName: day.name, date: sess.date};
  }
  DATA.activeSession = null;
  save();
  stopRestTimer();
  showSummaryModal(sess);
}

function showSummaryModal(sess){
  const mins = Math.floor(sess.durationSec/60);
  showModal(`
    <h2>Workout complete</h2>
    <div class="sub">${escapeHtml(sess.dayName)} · ${fmtDate(sess.date)}</div>
    ${sess.newPRs && sess.newPRs.length ? sess.newPRs.map(n=>`<div class="newpr-badge">🏆 New PR: ${escapeHtml(n)}</div>`).join('') : ''}
    <div class="summary-grid">
      <div class="summary-box"><div class="big">${mins||0}min</div><div class="lbl">Duration</div></div>
      <div class="summary-box"><div class="big">${sess.totalSets}</div><div class="lbl">Total sets</div></div>
      <div class="summary-box"><div class="big">${sess.totalReps}</div><div class="lbl">Total reps</div></div>
      <div class="summary-box"><div class="big">${Math.round(sess.totalVolume)}kg</div><div class="lbl">Total volume</div></div>
    </div>
    ${sess.kneePain.after!==null ? `<div class="knee-flag pill-dim">Knee pain after: ${sess.kneePain.after}/10</div>` : ''}
    <button class="btn btn-primary" data-action="closeModalHome">Done</button>
  `);
  const btn = document.querySelector('[data-action="closeModalHome"]');
  if(btn) btn.onclick = ()=>{ closeModal(); setTab('home'); };
}

function openNextMorningModal(){
  const info = DATA.pendingNextMorning;
  showModal(`
    <h2>Next-morning knee check</h2>
    <div class="sub">Following ${escapeHtml(info.dayName)} on ${fmtDate(info.date)}</div>
    <div class="painscale" id="nmScale">
      ${[0,1,2,3,4,5].map(v=>`<button data-val="${v}">${v}</button>`).join('')}
    </div>
    <div id="nmFlag" style="margin-top:12px;"></div>
    <button class="btn btn-primary" style="margin-top:14px;" id="nmSave" disabled>Save</button>
  `);
  let picked=null;
  document.querySelectorAll('#nmScale button').forEach(b=>{
    b.onclick = ()=>{
      picked=parseInt(b.dataset.val);
      document.querySelectorAll('#nmScale button').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      document.getElementById('nmFlag').innerHTML = kneeFlagHtml(picked);
      document.getElementById('nmSave').disabled=false;
      const sess = DATA.sessions.find(s=>s.id===info.sessionId);
      if(sess && sess.kneePain.before!==null && (picked - sess.kneePain.before)>=2){
        document.getElementById('nmFlag').innerHTML += `<div class="knee-flag pill-warn">Next-morning pain is meaningfully worse than baseline. Reduce knee-demanding volume by 30–50% next lower-body session.</div>`;
      }
    };
  });
  document.getElementById('nmSave').onclick = ()=>{
    const sess = DATA.sessions.find(s=>s.id===info.sessionId);
    if(sess) sess.kneePain.nextMorning = picked;
    DATA.pendingNextMorning = null;
    save();
    closeModal();
    renderTab();
  };
}

function openSessionDetail(sid){
  const s = DATA.sessions.find(x=>x.id===sid);
  if(!s) return;
  const exHtml = s.exercises.map(e=>{
    const rows = e.sets.filter(st=>st.completed).map((st,i)=>`<div class="hist-row-mini"><span>Set ${i+1}</span><span class="sets">${st.weight}kg × ${st.reps}</span></div>`).join('');
    return `<div style="margin-bottom:12px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:2px;">${escapeHtml(e.name)}</div>
      ${rows || '<div class="empty" style="padding:6px 0;">No completed sets</div>'}
      ${e.notes ? `<div class="ex-note">${escapeHtml(e.notes)}</div>` : ''}
    </div>`;
  }).join('');
  const sDayIdx = DATA.program.findIndex(d=>d.id===s.dayId);
  showModal(`
    <h2>${sDayIdx>-1?'Day '+(sDayIdx+1)+' — ':''}${escapeHtml(s.dayName)}</h2>
    <div class="sub">${fmtDateFull(s.date)} · Week ${s.weekNumber} · ${escapeHtml(s.phase)}</div>
    <div class="summary-grid">
      <div class="summary-box"><div class="big">${s.durationSec?Math.floor(s.durationSec/60):'—'}min</div><div class="lbl">Duration</div></div>
      <div class="summary-box"><div class="big">${s.totalSets}</div><div class="lbl">Sets</div></div>
      <div class="summary-box"><div class="big">${s.totalReps}</div><div class="lbl">Reps</div></div>
      <div class="summary-box"><div class="big">${Math.round(s.totalVolume)}kg</div><div class="lbl">Volume</div></div>
    </div>
    ${(s.kneePain && (s.kneePain.before!==null||s.kneePain.after!==null||s.kneePain.nextMorning!==null)) ? `
      <div class="divider"></div>
      <div style="font-size:12.5px;color:var(--text-dim);">Knee pain — before ${s.kneePain.before ?? '—'} · after ${s.kneePain.after ?? '—'} · next morning ${s.kneePain.nextMorning ?? '—'}</div>
    ` : ''}
    <div class="divider"></div>
    ${exHtml}
    ${s.notes ? `<div class="divider"></div><div style="font-size:13px;color:var(--text-dim);"><strong>Notes:</strong> ${escapeHtml(s.notes)}</div>` : ''}
    <button class="btn btn-ghost" data-action="closeModal" style="margin-top:10px;">Close</button>
  `);
}

/* ---------- nutrition / bodyweight ---------- */
function logNutrition(){
  const cal = document.getElementById('calInput');
  const pro = document.getElementById('proInput');
  const calVal = cal && cal.value ? parseInt(cal.value) : null;
  const proVal = pro && pro.value ? parseInt(pro.value) : null;
  if(calVal===null && proVal===null) return;
  const today = todayISO();
  let entry = DATA.nutrition.find(n=>n.date===today);
  if(!entry){ entry={date:today,calories:0,protein:0}; DATA.nutrition.push(entry); }
  if(calVal!==null) entry.calories = calVal;
  if(proVal!==null) entry.protein = proVal;
  save();
  renderTab();
}
function logBodyweight(){
  const inp = document.getElementById('bwInput');
  if(!inp || !inp.value) return;
  const val = parseFloat(inp.value);
  const today = todayISO();
  let entry = DATA.bodyweight.find(b=>b.date===today);
  if(!entry){ entry={date:today,weight:val}; DATA.bodyweight.push(entry); }
  else entry.weight = val;
  save();
  renderTab();
}

/* ---------- export/import ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hypertrophy-tracker-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!confirm('Import will replace your current data. Continue?')) return;
      DATA = Object.assign(defaultData(), parsed);
      save();
      renderTab();
      alert('Data imported.');
    }catch(err){
      alert('Could not read that file.');
    }
  };
  reader.readAsText(file);
}

/* ---------- modal ---------- */
function showModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.remove('hide');
  document.querySelectorAll('[data-action="closeModal"]').forEach(b=> b.onclick = closeModal);
}
function closeModal(){
  document.getElementById('overlay').classList.add('hide');
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeModal();
});

/* ---------- util ---------- */
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setTab('home');
