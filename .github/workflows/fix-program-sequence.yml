name: Fix workout sequence labels

on:
  push:
    paths:
      - 'hypertrophy-trackernew.html'
      - '.github/workflows/fix-program-sequence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app
        shell: python
        run: |
          from pathlib import Path
          p = Path('hypertrophy-trackernew.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old = """function getTodayProgramDay(){
            // Monday=0 ... Sunday=6 mapping to program index
            const jsDay = new Date().getDay(); // 0=Sun..6=Sat
            const idx = jsDay===0 ? 6 : jsDay-1; // Mon->0 ... Sun->6
            return idx;
          }"""
          new = """function getNextProgramIndex(){
            if(!DATA.sessions.length){
              const first = DATA.program.findIndex(d=>d.type==='training');
              return first>=0 ? first : 0;
            }
            const sessions = DATA.sessions.slice().sort((a,b)=>{
              if(a.date!==b.date) return a.date<b.date?-1:1;
              return String(a.id).localeCompare(String(b.id));
            });
            const last = sessions[sessions.length-1];
            const lastIdx = DATA.program.findIndex(d=>d.id===last.dayId);
            if(lastIdx<0) return 0;
            return (lastIdx+1)%DATA.program.length;
          }
          function getTodayProgramDay(){ return getNextProgramIndex(); }
          """
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace("const todayIdx = getTodayProgramDay();", "const todayIdx = getNextProgramIndex();")
          s = s.replace("<div class=\"eyebrow\">DAY ${todayIdx+1} · REST</div>", "<div class=\"eyebrow\">${todayIdx+1}. REST DAY</div>")
          s = s.replace("data-action=\"gotoTrain\">Log a workout anyway", "data-action=\"startRestDay\">Log Rest Day")
          s = s.replace("<div class=\"eyebrow\">NEXT WORKOUT · DAY ${todayIdx+1}</div>", "<div class=\"eyebrow\">NEXT WORKOUT · ${todayIdx+1}</div>")
          s = s.replace("<label>Choose day</label>", "<label>Choose workout</label>")
          s = s.replace("Day ${i+1} — ${escapeHtml(d.name)}${d.type==='rest'?' (Rest)':''}", "${i+1}. ${escapeHtml(d.name)}${d.type==='rest'?' (Rest)':''}")
          s = s.replace("<button class=\"btn btn-primary\" data-action=\"startPicked\">Start Workout</button>", "<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;\"><button class=\"btn btn-primary\" data-action=\"startPicked\">Start Workout</button><button class=\"btn btn-secondary\" data-action=\"startRestDay\">Log Rest Day</button></div>")
          s = s.replace("<h2 class=\"section\">This week's split</h2>", "<h2 class=\"section\">Workout sequence</h2>")
          s = s.replace("Day ${i+1} — ${escapeHtml(d.name)}", "${i+1}. ${escapeHtml(d.name)}")
          s = s.replace("Day ${activeDayIdx+1} — ${escapeHtml(day.name)}", "${activeDayIdx+1}. ${escapeHtml(day.name)}")
          s = s.replace("}else if(action==='gotoTrain'){", "}else if(action==='startRestDay'){\n      el.onclick = ()=> startRestDay();\n    }else if(action==='gotoTrain'){")

          marker = "function startSession(dayIdx){"
          rest_fn = """function startRestDay(){
            const restIdx = DATA.program.findIndex(d=>d.type==='rest');
            if(restIdx<0) return;
            startSession(restIdx);
          }

          """
          if rest_fn not in s and marker in s:
              s = s.replace(marker, rest_fn + marker, 1)

          # Make the active rest session clearly a recovery log.
          old_header = """<div style=\"font-size:16px;font-weight:800;\">${activeDayIdx+1}. ${escapeHtml(day.name)}</div>"""
          new_header = """<div style=\"font-size:16px;font-weight:800;\">${activeDayIdx+1}. ${escapeHtml(day.name)}</div>"""
          s = s.replace(old_header, new_header)

          # Add a recovery note above the finish button for rest sessions.
          needle = """    ${kneeAfter}
    <div class=\"card\">"""
          replacement = """    ${kneeAfter}
    ${day.type==='rest' ? `<div class=\"card\" style=\"border-color:var(--teal);\"><div style=\"font-size:17px;font-weight:800;\">Rest / Recovery</div><div style=\"font-size:13px;color:var(--text-dim);margin-top:5px;line-height:1.45;\">Log this as a recovery day. Add notes for sleep, soreness, cardio or how recovered you feel.</div></div>` : ''}
    <div class=\"card\">"""
          s = s.replace(needle, replacement, 1)

          if s == original:
              raise SystemExit('No patch changes were made')
          p.write_text(s, encoding='utf-8')

      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hypertrophy-trackernew.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Use sequence-based workout names and log rest days'
          git push
