name: Deploy Hypertrophy Tracker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply final rest-day UI fix
        run: python scripts/fix_rest.py

      - name: Apply Phase 1 coaching UI
        run: python scripts/phase1_coaching.py

      - name: Apply Phase 2 hypertrophy coaching engine
        run: |
          if grep -q "recommendation engine — Phase 2 hypertrophy-specific progression" index.html; then
            echo "Phase 2 coaching already applied"
          else
            python scripts/phase2_coaching.py
          fi

      - name: Apply delete workout feature
        run: |
          if grep -q "DELETE WORKOUT FEATURE" index.html; then
            echo "Delete workout feature already applied"
          else
            python scripts/delete_workout.py
          fi

      - name: Fix History delete UI
        run: python scripts/fix_history_delete.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
