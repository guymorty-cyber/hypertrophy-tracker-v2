name: Test and deploy Hypertrophy Tracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    outputs:
      pages_artifact: hypertrophy-pages-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check persistence and workout behaviour
        run: |
          node tests/regression.cjs
          node tests/coaching.cjs
          node tests/logging.cjs
          node tests/history.cjs
          node tests/progress.cjs
          node tests/programme.cjs
          node tests/adaptive.cjs
          node tests/dashboard.cjs
          node tests/mobile.cjs
          node tests/reliability.cjs
          node tests/clarity.cjs
          node tests/body.cjs
      - name: Install browser test tools
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          # Avoid the Azure mirror, which stalled browser dependencies in CI.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium webkit
      - name: Package Pages
        run: python scripts/build_pages.py
      - name: Test mobile workouts, offline loading and updates
        timeout-minutes: 5
        run: |
          node tests/body-browser.mjs
          node tests/browser-smoke.mjs
          node tests/coaching-browser.mjs
          node tests/logging-browser.mjs
          node tests/history-browser.mjs
          node tests/progress-browser.mjs
          node tests/programme-browser.mjs
          node tests/adaptive-browser.mjs
          node tests/dashboard-browser.mjs
          node tests/mobile-browser.mjs
          node tests/reliability-browser.mjs
          node tests/clarity-browser.mjs
          node tests/pwa.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: hypertrophy-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.check.outputs.pages_artifact }}

      - name: Verify published PWA
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          python - <<'PYVERIFY'
          import json, os, time, urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          build=os.environ['EXPECTED_BUILD']
          def get(path):
              with urllib.request.urlopen(base+path+'?verify='+build+'-'+str(time.time_ns()), timeout=15) as response:
                  return response.read().decode('utf-8')
          for attempt in range(12):
              try:
                  assert json.loads(get('version.json'))['build']==build
                  assert './assets/'+build+'/' in get('index.html')
                  assert "const BUILD='"+build+"'" in get('sw.js')
                  assert json.loads(get('manifest.webmanifest'))['start_url']=='./'
                  print('Published PWA verified:',base,build)
                  break
              except Exception:
                  if attempt==11: raise
                  time.sleep(5)
          PYVERIFY
