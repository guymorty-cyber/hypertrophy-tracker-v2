name: Add workout coaching and sequence UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-app:
    if: "!contains(github.event.head_commit.message, 'Update app coaching and workout sequence')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hypertrophy-trackernew.html')
          s = p.read_text()

          # ---------------- coaching UI (idempotent) ----------------
          if '.reco-coach{' not in s:
              old_css = '.reco-maintain{background:rgba(242,179,61,.13);color:var(--warn);}\n'
              new_css = old_css + '''.reco-coach{margin-top:10px;background:linear-gradient(135deg,rgba(255,122,61,.13),rgba(53,201,176,.10));border:1px solid rgba(255,122,61,.28);color:var(--text);}\n.reco-coach .coach-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:900;margin-bottom:4px;}\n.reco-coach .coach-main{font-size:14px;font-weight:800;line-height:1.35;}\n.reco-coach .coach-detail{font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.4;}\n'''
              if old_css in s:
                  s = s.replace(old_css, new_css, 1)

          if "const rec = log.sets.every(s=>s.completed) ? computeRecommendation(ex, log) : null;" in s:
              s = s.replace(
                  "const rec = log.sets.every(s=>s.completed) ? computeRecommendation(ex, log) : null;",
                  "const rec = computeRecommendation(ex, lastLog && lastLog.log);",
                  1
              )

          # ---------------- sequence-based workout selection ----------------
          marker = 'function getTodayProgramDay(){'
          start = s.find(marker)
          end = s.find('function estOneRM', start)
          if start != -1 and end != -1 and 'function getNextProgramIndex()' not in s:
              replacement = '''function getTodayProgramDay(){
            return getNextProgramIndex();
          }
          function getNextProgramIndex(){
            if(!DATA.sessions.length){
              const first = DATA.program.findIndex(d=>d.type==='training');
              return first>=0 ? first : 0;
            }
            const sessions = DATA.sessions.slice().sort((a,b)=>{
              if(a.date!==b.date) return a.date<b.date?-1:1;
              return String(a.id).localeCompare(String(b.id));
            });
            const last = sessions[sessions.length-1];
            const lastIdx = DATA.program.findIndex(d=>d.id===last.dayId);
            if(lastIdx<0) return 0;
            return (lastIdx+1)%DATA.program.length;
          }
          '''
              s = s[:start] + replacement + s[end:]

          s = s.replace(
              'const todayIdx = getTodayProgramDay();\n  const day = DATA.program[todayIdx];',
              'const todayIdx = getNextProgramIndex();\n  const day = DATA.program[todayIdx];'
          )
          s = s.replace('<div class="eyebrow">DAY ${todayIdx+1} · REST</div>', '<div class="eyebrow">${todayIdx+1}. REST DAY</div>')
          s = s.replace('<button class="btn btn-secondary" data-action="gotoTrain">Log a workout anyway</button>', '<button class="btn btn-secondary" data-action="startRestDay">Log Rest Day</button>')
          s = s.replace('<div class="eyebrow">NEXT WORKOUT · DAY ${todayIdx+1}</div>', '<div class="eyebrow">NEXT WORKOUT · ${todayIdx+1}</div>')
          s = s.replace('<label>Choose day</label>', '<label>Choose workout</label>')
          s = s.replace('<option value="${i}" ${i===todayIdx?\'selected\':\'\'}>Day ${i+1} — ${escapeHtml(d.name)}${d.type===\'rest\'?\' (Rest)\':\'\'}</option>', '<option value="${i}" ${i===todayIdx?\'selected\':\'\'}>${i+1}. ${escapeHtml(d.name)}${d.type===\'rest\'?\' (Rest)\':\'\'}</option>')
          s = s.replace("<h2 class=\"section\">This week's split</h2>", '<h2 class="section">Workout sequence</h2>')
          s = s.replace('<div style="font-size:13.5px;">Day ${i+1} — ${escapeHtml(d.name)}</div>', '<div style="font-size:13.5px;">${i+1}. ${escapeHtml(d.name)}</div>')
          s = s.replace('<button class="btn btn-primary" data-action="startPicked">Start Workout</button>\n    </div>', '<button class="btn btn-primary" data-action="startPicked">Start Workout</button>\n      <button class="btn btn-secondary" data-action="startRestDay">Log Rest Day</button>\n    </div>')
          s = s.replace('<div style="font-size:16px;font-weight:800;">Day ${activeDayIdx+1} — ${escapeHtml(day.name)}</div>', '<div style="font-size:16px;font-weight:800;">${activeDayIdx+1}. ${escapeHtml(day.name)}</div>')
          s = s.replace("<h2>${sDayIdx>-1?'Day '+(sDayIdx+1)+' — ':''}${escapeHtml(s.dayName)}</h2>", "<h2>${sDayIdx>-1?(sDayIdx+1)+'. ':''}${escapeHtml(s.dayName)}</h2>")

          if "else if(action==='startRestDay')" not in s:
              s = s.replace("}else if(action==='gotoTrain'){\n      el.onclick = ()=> setTab('train');", "}else if(action==='gotoTrain'){\n      el.onclick = ()=> setTab('train');\n    }else if(action==='startRestDay'){\n      el.onclick = ()=> startRestDay();")
          if 'function startRestDay()' not in s:
              s = s.replace('function getActiveExLog(exId){', '''function startRestDay(){
            const restIdx = DATA.program.findIndex(d=>d.type==='rest');
            if(restIdx<0) return;
            startSession(restIdx);
          }
          function getActiveExLog(exId){''')
          if 'const restIntro = day.type===\'rest\'' not in s:
              old = '''  const activeDayIdx = DATA.program.findIndex(d=>d.id===day.id);
  return `
    <div class="card card-tight" style="display:flex;justify-content:space-between;align-items:center;">'''
              new = '''  const activeDayIdx = DATA.program.findIndex(d=>d.id===day.id);
  const restIntro = day.type==='rest' ? `<div class="card" style="border-color:var(--teal);">
      <div style="font-size:17px;font-weight:800;">Rest / Recovery</div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:5px;line-height:1.45;">Log this as a recovery day. No lifting is required. Add notes if you want to record sleep, soreness, cardio or how recovered you feel.</div>
    </div>` : '';
  return `
    <div class="card card-tight" style="display:flex;justify-content:space-between;align-items:center;">'''
              if old in s:
                  s = s.replace(old,new,1)
                  s = s.replace('    </div>\n    ${kneeBefore}', '    </div>\n    ${restIntro}\n    ${kneeBefore}', 1)

          p.write_text(s)
          PY

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hypertrophy-trackernew.html
          git diff --cached --quiet && exit 0
          git commit -m "Update app coaching and workout sequence"
          git push
